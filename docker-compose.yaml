services:
  postgres:
    image: postgres:16-alpine
    container_name: posture-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-switch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - posture-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: posture-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - posture-net
    # Uncomment below for NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Not used in local dev (Terminal 3 runs `npm start` on the host instead),
  # but kept here so you can containerize the backend for deployment later:
  #
  # backend:
  #   build:
  #     context: .
  #     dockerfile: src/Dockerfile
  #   container_name: posture-backend
  #   env_file:
  #     - .env
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     OLLAMA_BASE_URL: http://ollama:11434
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     ollama:
  #       condition: service_started
  #   networks:
  #     - posture-net
  #   restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  posture-net:
    driver: bridge
